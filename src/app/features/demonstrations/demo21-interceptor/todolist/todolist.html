<h3>Liste de mes todos:</h3>

<div class="mb-3">
  <button class="btn btn-success" (click)="openModal()">Ajouter</button>
</div>

<div class="mb-3">
  <ul class="list-group">
    @for (todo of todos.value(); track todo.id) {
    <li class="list-group-item d-flex justify-content-between align-items-center list-group-item-action">
      <div class="d-flex w-100">
        <select class="form-select w-25 me-3" [id]="todo.id" [value]="todo.status"
          (change)="updateStatus(todo, $event)">
          <option value="0">Pas commencé</option>
          <option value="1">En cours</option>
          <option value="2">Terminé</option>
        </select>
        <label class="form-check-label w-75" [for]="todo.id">
          <span class="fw-bold">{{ todo.title }}</span> <br>
          <small>{{ todo.description }}</small>
        </label>
      </div>
      <div>
        <button class="btn">🖋️</button>
        <button class="btn" (click)="deleteTodo(todo)">🗑️</button>
      </div>
    </li>
    }
  </ul>
</div>

<div class="toast-container position-fixed top-0 end-0 p-5">
  <div #toastEl class="toast" role="alert" data-bs-delay="5000">
    <div class="toast-header">
      <strong class="me-auto">{{ toastTodoName() }}</strong>
      <small></small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      {{ toastMessage() }}
    </div>
  </div>
</div>


<div #modalEl class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ajouter une tâche</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-todolist-add (todoSignal)="createTodo($event)" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="todolistAddComp.onSubmit()">Créer la tâche</button>
      </div>
    </div>
  </div>
</div>
