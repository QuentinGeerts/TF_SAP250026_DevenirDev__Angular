<h4>Connexion</h4>

<div class="container">
  <div class="row">
    <div class="col">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        @if (errorResponse() !== null) {
          <div class="alert" [class]="{'alert-success': !errorResponse(), 'alert-danger': errorResponse()}" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" formControlName="email" id="email" class="form-control">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe:</label>
          <input [type]="displayPassword() ? 'text' : 'password'" formControlName="password" id="password" class="form-control">
        </div>

        <div class="mb-3 form-check">
          <input class="form-check-input" type="checkbox" value="" id="display-password" (change)="onChange()" [checked]="displayPassword()">
          <label class="form-check-label" for="display-password">
            Afficher le mot de passe
          </label>
        </div>

        <div class="mb-3">
          <button class="btn btn-dark" [disabled]="loginForm.invalid">Se connecter</button>
        </div>

      </form>
    </div>
  </div>
</div>
